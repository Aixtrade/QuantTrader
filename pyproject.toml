[project]
name = "xqtrader"
description = "Quant trading engine toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.5.34",
    "click>=8.3.1",
    "httpx>=0.28.1",
    "numpy>=2.4.1",
    "pydantic>=2.12.5",
    "rich>=14.3.3",
    "talipp>=2.7.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "setuptools-scm>=8.1",
]

[project.scripts]
xqtrader = "cli.main:cli"
xqt = "cli.main:cli"

[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["xqtrader*", "cli*"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
write_to = "xqtrader/_version.py"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]
